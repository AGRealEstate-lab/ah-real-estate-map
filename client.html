<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AG Real Estate — Мінізастосунок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
:root{--yellow:#f6c445;--yellow2:#ffca28;--navy:#172033;--navy2:#263451;--blue:#3568e8;--muted:#7b8493;--line:rgba(16,17,20,.09);--bg:#f7f7f5;--white:#fff}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:#101114;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:repeating-linear-gradient(0deg,transparent 0,transparent 39px,rgba(16,17,20,.045) 40px),repeating-linear-gradient(90deg,transparent 0,transparent 39px,rgba(16,17,20,.045) 40px);pointer-events:none}
body:after{content:"";position:fixed;width:420px;height:420px;right:-180px;top:-140px;border:1px solid rgba(16,17,20,.08);border-radius:50%;box-shadow:0 0 0 40px rgba(16,17,20,.025),0 0 0 80px rgba(16,17,20,.018);z-index:-1;pointer-events:none}
.wrap{max-width:820px;margin:auto;padding:18px 14px 100px}
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 28px rgba(23,32,51,.16)}
.hero:after{content:"";position:absolute;width:170px;height:220px;right:55px;top:-55px;border-radius:50%;border-left:35px solid rgba(246,196,69,.32);border-right:0 solid transparent;transform:rotate(3deg)}
.hero h1{position:relative;z-index:2;margin:0;font-size:27px;letter-spacing:-.7px;font-weight:900}.hero .sub{position:relative;z-index:2;margin-top:7px;color:#aebbd0;font-size:12px;letter-spacing:2px;font-weight:800}.hero .tag{position:absolute;right:18px;top:30px;z-index:3;color:var(--yellow);font-weight:800;text-align:right;line-height:1.25;font-size:15px}
.mode{display:flex;gap:0;background:var(--navy);border-radius:20px;padding:4px;margin-bottom:13px;box-shadow:0 4px 14px rgba(23,32,51,.1)}
.mode button{flex:1;border:0;background:transparent;color:#fff;border-radius:16px;padding:14px 10px;font-size:16px;font-weight:800}.mode button.active{background:var(--yellow);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.searchBox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 18px rgba(0,0,0,.035);margin-bottom:10px}.searchIcon{font-size:25px;color:#566174}.searchBox input{border:0!important;outline:0!important;background:transparent!important;padding:0!important;margin:0!important;box-shadow:none!important;font-size:15px;width:100%;color:var(--navy)}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 1px 6px;margin-bottom:7px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filterBtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 14px;color:var(--navy);font-weight:750}.filterBtn.active{border-color:var(--yellow);background:#fff8dc}
.filterPanel{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}.filterPanel.open{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filterPanel input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.filterPanel .wide{grid-column:1/-1}
.resultsHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 3px 9px}.resultsCount{font-size:18px;font-weight:850;color:var(--navy)}.sort{border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px 10px;font-weight:700;color:var(--navy)}
.card{position:relative;display:grid;grid-template-columns:43% 57%;gap:0;background:var(--navy);color:#fff;border:1px solid #263451;border-radius:20px;overflow:hidden;margin:11px 0;box-shadow:0 8px 24px rgba(23,32,51,.16)}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow);z-index:5}.media3{padding:13px 9px 13px 13px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:5px;min-height:205px}.mediaMain{grid-row:1/3;position:relative;overflow:hidden;border-radius:13px;background:#263451}.mediaSmall{position:relative;overflow:hidden;border-radius:10px;background:#263451}.media3 img,.media3 video{width:100%;height:100%;object-fit:cover;display:block}.more{position:absolute;right:5px;bottom:5px;background:rgba(15,20,31,.78);padding:7px 10px;border-radius:9px;font-weight:800;color:#fff}.videoBadge{position:absolute;left:7px;top:7px;background:rgba(15,20,31,.75);border-radius:8px;padding:5px 7px;font-size:12px}
.noMedia{margin:13px 9px 13px 13px;min-height:205px;border-radius:13px;background:#263451;display:flex;align-items:center;justify-content:center;color:#aebbd0;font-size:12px;text-align:center;padding:15px}
.cardBody{padding:15px 15px 14px 10px;min-width:0}.cardTitle{font-size:20px;font-weight:900;line-height:1.15;margin-right:24px}.heart{position:absolute;right:14px;top:13px;background:none;border:0;color:#fff;font-size:28px;padding:0;line-height:1;z-index:8}.loc{color:#aebbd0;margin-top:8px;font-size:14px}.meta{margin-top:7px;font-size:14px}.price{font-size:22px;font-weight:950;color:var(--yellow);margin-top:10px}.status{color:#aebbd0;font-size:13px;margin-top:6px}.cardActions{display:flex;gap:7px;margin-top:12px}.cardActions button{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:850;font-size:13px}.detailsBtn{background:var(--navy2);color:#fff}.askBtn{background:var(--yellow);color:var(--navy)}
.empty{background:#fff;border:1px dashed #cfd6df;border-radius:18px;padding:35px 15px;text-align:center;color:var(--muted)}#status{color:var(--muted);padding:3px 3px 4px;font-size:13px}.error{color:#b00020}
.bottomNav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);background:rgba(23,32,51,.97);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;box-shadow:0 -8px 25px rgba(0,0,0,.12)}.navBtn{border:0;background:transparent;color:#aebbd0;font-size:12px;font-weight:750;padding:4px 18px}.navBtn .ico{display:block;font-size:23px;margin-bottom:3px}.navBtn.active{color:var(--yellow)}
.modal{position:fixed;inset:0;background:rgba(8,12,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:10px;backdrop-filter:blur(5px)}.modal.show{display:flex}.sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 22px 65px rgba(0,0,0,.25)}.sheet h2{margin:0 0 6px;color:var(--navy);font-size:21px}.sheetMeta{color:var(--muted);font-size:13px;line-height:1.45}.gallery10{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:13px 0}.gallery10 img,.gallery10 video{width:100%;height:220px;object-fit:cover;border-radius:13px;background:#eef1f5;display:block}.description{white-space:pre-wrap;line-height:1.5;color:#3e4652;margin:10px 0 14px}.closeBtn{width:100%;border:0;background:#111;color:#fff;border-radius:13px;padding:13px;font-weight:850}.leadForm input,.leadForm textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;font:inherit;margin:7px 0;background:#fff}.leadForm textarea{min-height:90px;resize:vertical}.sendBtn{width:100%;border:0;background:var(--yellow);color:var(--navy);border-radius:13px;padding:13px;font-weight:900;margin-top:4px}.cancelBtn{width:100%;border:0;background:#edf0f4;color:var(--navy);border-radius:13px;padding:12px;font-weight:800;margin-top:8px}
@media(max-width:650px){.wrap{padding:12px 10px 100px}.hero{padding:19px 15px;border-radius:19px}.hero h1{font-size:24px}.hero .tag{font-size:12px;right:13px;top:28px}.card{grid-template-columns:42% 58%}.media3,.noMedia{min-height:190px}.media3{padding:10px 7px 10px 10px}.cardBody{padding:12px 10px 12px 8px}.cardTitle{font-size:18px}.price{font-size:20px}.cardActions button{font-size:12px;padding:10px 5px}.gallery10{grid-template-columns:1fr}.gallery10 img,.gallery10 video{height:260px}}
@media(max-width:420px){.card{grid-template-columns:40% 60%}.media3,.noMedia{min-height:180px}.loc,.meta,.status{font-size:12px}.cardTitle{font-size:17px}.price{font-size:18px}.cardActions{gap:5px}.cardActions button{font-size:11px}}
</style>
</head>
<body>
<div class="wrap" id="home">
  <section class="hero"><h1>AG Real Estate</h1><div class="sub">НЕРУХОМІСТЬ ДЛЯ ВАС</div><div class="tag">Знайди<br>свій дім 🏠</div></section>
  <div class="mode"><button id="saleTab" class="active" data-mode="sale">🏠 Купити</button><button id="rentTab" data-mode="rent">🔑 Орендувати</button></div>
  <div class="searchBox"><span class="searchIcon">⌕</span><input id="keyword" placeholder="Пошук за містом, районом або ключовим словом"></div>
  <div class="filters">
    <button class="filterBtn" id="cityBtn">Місто⌄</button><button class="filterBtn" id="typeBtn">Тип⌄</button><button class="filterBtn" id="roomsBtn">Кімнати⌄</button><button class="filterBtn" id="priceBtn">Ціна⌄</button><button class="filterBtn" id="filterBtn">⚙︎</button>
  </div>
  <div id="filterPanel" class="filterPanel">
    <input id="city" class="wide" placeholder="Місто або район">
    <input id="rooms" type="number" min="1" placeholder="Кімнат">
    <input id="maxPrice" type="number" min="0" placeholder="Макс. ціна, USD">
    <input id="minArea" type="number" min="0" placeholder="Площа від, м²">
    <button id="applyFilters" class="wide" style="border:0;background:#111;color:#fff;border-radius:11px;padding:12px;font-weight:800">🔎 Застосувати</button>
  </div>
  <div class="resultsHead"><div id="status" class="resultsCount">Завантаження...</div><select id="sort" class="sort"><option value="new">↕ Спочатку нові</option><option value="priceAsc">Ціна ↑</option><option value="priceDesc">Ціна ↓</option><option value="views">Популярні</option></select></div>
  <div id="list"></div>
</div>

<nav class="bottomNav"><button class="navBtn active" id="navHome"><span class="ico">⌂</span>Головна</button><button class="navBtn" id="navFav"><span class="ico">♡</span>Обране</button><button class="navBtn" id="navLeads"><span class="ico">▤</span>Мої заявки</button></nav>

<div id="detailsModal" class="modal" onclick="if(event.target===this)closeDetails()"><div class="sheet"><h2 id="dTitle">Деталі об'єкта</h2><div id="dMeta" class="sheetMeta"></div><div id="dGallery" class="gallery10"></div><div id="dDescription" class="description"></div><button id="dAsk" class="sendBtn">💬 Запитати</button><button class="closeBtn" onclick="closeDetails()" style="margin-top:8px">Закрити</button></div></div>

<div id="leadModal" class="modal" onclick="if(event.target===this)closeLead()"><div class="sheet"><h2 id="leadTitle">Запит щодо об'єкта</h2><div id="leadMeta" class="sheetMeta"></div><div class="leadForm"><input id="name" placeholder="Ваше ім'я"><input id="phone" type="tel" placeholder="Телефон"><textarea id="message" placeholder="Повідомлення (необов'язково)"></textarea><button id="send" class="sendBtn">📩 Надіслати заявку</button><button class="cancelBtn" onclick="closeLead()">Скасувати</button></div></div></div>

<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}
const API="https://xrpggdiyebwejhxfdmwe.supabase.co/functions/v1/client-catalog";
let mode="sale",allProperties=[],selectedProperty=null,leadKind="Запит",showFavorites=false,showLeads=false;
const $=id=>document.getElementById(id);
const favKey="agre_client_favorites";const leadKey="agre_client_leads";
function getFavs(){try{return JSON.parse(localStorage.getItem(favKey)||"[]")}catch{return[]}}function setFavs(a){localStorage.setItem(favKey,JSON.stringify(a))}
function getLocalLeads(){try{return JSON.parse(localStorage.getItem(leadKey)||"[]")}catch{return[]}}function setLocalLeads(a){localStorage.setItem(leadKey,JSON.stringify(a))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v,c){if(v==null||v==="")return"Ціна за запитом";const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat("uk-UA").format(n)+" "+(c||"USD"):esc(v)}
function mediaUrls(p){if(Array.isArray(p?.photo_urls))return p.photo_urls.filter(Boolean);if(typeof p?.photo_urls==="string"&&p.photo_urls.trim()){try{const a=JSON.parse(p.photo_urls);return Array.isArray(a)?a.filter(Boolean):[]}catch{}}return[]}
function isVideo(u){return /\.(mp4|mov|webm|m4v|ogg)(?:[?#].*)?$/i.test(String(u||""))}
function mediaEl(u,cls=""){return isVideo(u)?`<video class="${cls}" src="${esc(u)}" muted playsinline preload="metadata"></video>`:`<img class="${cls}" src="${esc(u)}" loading="lazy" alt="">`}
function cardMedia(p){const urls=mediaUrls(p).slice(0,3);if(!urls.length)return`<div class="noMedia">📷<br>Фото та відео<br>не додані</div>`;return`<div class="media3">${urls.map((u,i)=>`<div class="${i===0?'mediaMain':'mediaSmall'}">${mediaEl(u)}${isVideo(u)?'<span class="videoBadge">▶ Відео</span>':''}${i===2&&mediaUrls(p).length>3?`<span class="more">+${mediaUrls(p).length-3}</span>`:""}</div>`).join("")}</div>`}
function renderCard(p){const fav=getFavs().includes(Number(p.id));const meta=[p.rooms?`🛏 ${esc(p.rooms)} кімн.`:"",p.area?`📐 ${esc(p.area)} м²`:""].filter(Boolean).join("  •  ");return`<article class="card"><button class="heart" onclick="toggleFav(${Number(p.id)},event)">${fav?'♥':'♡'}</button>${cardMedia(p)}<div class="cardBody"><div class="cardTitle">#${esc(p.id)} ${esc(p.title||"Нерухомість")}</div><div class="loc">📍 ${esc([p.city,p.district].filter(Boolean).join(", ")||"Локацію не вказано")}</div><div class="meta">${meta||"—"}</div><div class="price">${money(p.price,p.currency)}</div><div class="status">Статус: ${esc(statusText(p.status))}</div><div class="cardActions"><button class="detailsBtn" onclick="openDetails(${Number(p.id)})">ⓘ Деталі</button><button class="askBtn" onclick="openLead(${Number(p.id)},'Запит')">💬 Запитати</button></div></div></article>`}
function statusText(s){return({for_sale:"Продається",for_rent:"Доступний для оренди",sold:"Продано",rented:"Здано",archived:"Архів"})[s]||s||"—"}
function sortProps(a){const x=[...a];const s=$("sort").value;if(s==="priceAsc")x.sort((a,b)=>(Number(a.price)||Infinity)-(Number(b.price)||Infinity));else if(s==="priceDesc")x.sort((a,b)=>(Number(b.price)||0)-(Number(a.price)||0));else if(s==="views")x.sort((a,b)=>(Number(b.views)||0)-(Number(a.views)||0));else x.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));return x}
function render(){let props=sortProps(allProperties);if(showFavorites){const f=getFavs();props=props.filter(p=>f.includes(Number(p.id)))}if(showLeads){const ids=getLocalLeads();props=props.filter(p=>ids.includes(Number(p.id)))}$("status").textContent=(showFavorites?"Обране: ":showLeads?"Мої заявки: ":"Знайдено об'єктів: ")+props.length;$("list").innerHTML=props.length?props.map(renderCard).join(""):`<div class="empty">${showFavorites?"В обраному поки немає об'єктів.":showLeads?"Ви ще не надсилали заявки з цього пристрою.":"За цими параметрами оголошень поки немає."}</div>`}
async function loadProperties(){showFavorites=false;showLeads=false;$("status").textContent="Завантаження...";$("list").innerHTML="";const q=$("keyword").value.trim();const params=new URLSearchParams({mode,popular:"true"});const city=$("city").value.trim(),rooms=$("rooms").value,maxPrice=$("maxPrice").value,minArea=$("minArea").value;if(q)params.set("city",q);else if(city)params.set("city",city);if(rooms)params.set("rooms",rooms);if(maxPrice)params.set("maxPrice",maxPrice);if(minArea)params.set("minArea",minArea);try{const r=await fetch(API+"?"+params.toString(),{headers:{Accept:"application/json"}});const j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.error||"Помилка сервера");allProperties=Array.isArray(j)?j:(j?.properties||j?.items||[]);render()}catch(e){$("status").innerHTML='<span class="error">Не вдалося завантажити оголошення. Спробуйте ще раз.</span>';console.error(e)}}
function toggleFav(id,e){e?.stopPropagation();let f=getFavs();id=Number(id);f=f.includes(id)?f.filter(x=>x!==id):[...f,id];setFavs(f);render()}
async function openDetails(id){const p=allProperties.find(x=>Number(x.id)===Number(id));if(!p)return;selectedProperty=p;$("dTitle").textContent=`🏠 ${p.title||"Об'єкт"}`;$("dMeta").textContent=[p.city,p.district].filter(Boolean).join(", ")+" • "+(p.rooms||"—")+" кімн. • "+(p.area||"—")+" м² • "+money(p.price,p.currency);const urls=mediaUrls(p).slice(0,10);$("dGallery").innerHTML=urls.length?urls.map(u=>mediaEl(u)).join(""):'<div class="empty" style="grid-column:1/-1">Фото та відео не додані.</div>';$('dDescription').textContent=p.description||"Опис відсутній.";$("detailsModal").classList.add("show");try{await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"view",property_id:Number(id),telegram_user_id:tg?.initDataUnsafe?.user?.id||null})})}catch(e){}}
function closeDetails(){$("detailsModal").classList.remove("show")}
function openLead(id,kind="Запит"){const p=allProperties.find(x=>Number(x.id)===Number(id));if(!p)return;selectedProperty=p;leadKind=kind;$("leadTitle").textContent=kind==="Перегляд"?"Замовити перегляд":"Запит щодо об'єкта";$("leadMeta").textContent=`#${p.id} ${p.title||"Нерухомість"} • ${[p.city,p.district].filter(Boolean).join(", ")}`;$("message").value=kind==="Перегляд"?"Хочу домовитися про перегляд.":"";$("leadModal").classList.add("show")}
function closeLead(){$("leadModal").classList.remove("show")}
$("dAsk").addEventListener("click",()=>{closeDetails();openLead(selectedProperty?.id,"Запит")});
$("send").addEventListener("click",async()=>{const name=$("name").value.trim(),phone=$("phone").value.trim(),message=$("message").value.trim();if(!name||!phone){alert("Будь ласка, вкажіть ім'я та телефон.");return}$("send").disabled=true;$("send").textContent="Надсилання...";try{const payload={property_id:selectedProperty.id,lead_type:leadKind,name,phone,message,telegram_user_id:tg?.initDataUnsafe?.user?.id||null,username:tg?.initDataUnsafe?.user?.username||null,initData:tg?.initData||""};const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.error||"Не вдалося надіслати заявку");let ids=getLocalLeads();if(!ids.includes(Number(selectedProperty.id)))ids.push(Number(selectedProperty.id));setLocalLeads(ids);closeLead();$("name").value="";$("phone").value="";$("message").value="";alert("Дякуємо! Заявку надіслано.")}catch(e){alert("Не вдалося надіслати заявку. Спробуйте ще раз.");console.error(e)}finally{$("send").disabled=false;$("send").textContent="📩 Надіслати заявку"}});
function setMode(m){mode=m;$("saleTab").classList.toggle("active",m==="sale");$("rentTab").classList.toggle("active",m==="rent");loadProperties()}
$("saleTab").onclick=()=>setMode("sale");$("rentTab").onclick=()=>setMode("rent");$("applyFilters").onclick=()=>{$("filterPanel").classList.remove("open");loadProperties()};$("sort").onchange=render;$("filterBtn").onclick=()=>$("filterPanel").classList.toggle("open");$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter")loadProperties()});$("cityBtn").onclick=()=>{$("filterPanel").classList.add("open");$("city").focus()};$("roomsBtn").onclick=()=>{$("filterPanel").classList.add("open");$("rooms").focus()};$("priceBtn").onclick=()=>{$("filterPanel").classList.add("open");$("maxPrice").focus()};$("typeBtn").onclick=()=>setMode(mode==="sale"?"rent":"sale");
$("navHome").onclick=()=>{showFavorites=false;showLeads=false;document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));$("navHome").classList.add("active");window.scrollTo({top:0,behavior:"smooth"});render()};$("navFav").onclick=()=>{showFavorites=true;showLeads=false;document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));$("navFav").classList.add("active");render()};$("navLeads").onclick=()=>{showFavorites=false;showLeads=true;document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));$("navLeads").classList.add("active");render()};
loadProperties();
</script>
</body>
</html>
